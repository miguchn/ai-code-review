# 生产环境配置
server:
  port: 8080

# 数据源配置
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/acr?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
        username: ${DB_USER:acr_prod}
        password: ${DB_PASSWORD:}
      slave:
        enabled: false
        url:
        username:
        password:
      initialSize: 20
      minIdle: 20
      maxActive: 50
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 5
          max-idle: 15
          max-active: 50
          max-wait: -1ms
  devtools:
    restart:
      enabled: false

# 日志配置
logging:
  level:
    com.acr: warn
    org.springframework: error

# 文件路径（生产环境，Linux 示例）
acr:
  profile: /home/acr/uploadPath
